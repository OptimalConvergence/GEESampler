[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "geesampler"
version = "0.3.0"
description = "Concurrent, resumable point and image-patch sampling from Google Earth Engine"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "OptimalConvergence"}]
keywords = ["earth-engine", "remote-sensing", "geospatial", "sentinel-2", "gedi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "earthengine-api>=1.5",
  "httplib2>=0.22",
  "mgrs>=1.5",
  "pandas>=2.0",
  "pyproj>=3.5",
  "PyYAML>=6.0",
  "requests>=2.31",
]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "pyarrow>=14", "rasterio>=1.3", "shapely>=2.0"]
monitoring = ["google-cloud-monitoring>=2.21"]
plots = ["matplotlib>=3.7", "numpy>=1.24", "rasterio>=1.3"]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
all = [
  "geopandas>=0.14",
  "google-cloud-monitoring>=2.21",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pyarrow>=14",
  "rasterio>=1.3",
  "shapely>=2.0",
]

[project.urls]
Homepage = "https://github.com/OptimalConvergence/GEESampler"
Repository = "https://github.com/OptimalConvergence/GEESampler"
Issues = "https://github.com/OptimalConvergence/GEESampler/issues"

[project.scripts]
geesampler = "geesampler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/geesampler"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
