auth:
  project: ${GEE_PROJECT}
  service_account: ${GEE_SERVICE_ACCOUNT}
  key_file: ${GEE_KEY_FILE}
proxy_url: ${HTTPS_PROXY:-}
catalog:
  enabled: true
  path: ${GEESAMPLER_DATA_ROOT:-./geesampler-output}/catalog/sentinel2.sqlite
  mode: read_through
  metadata_workers: 2
  metadata_cloud_max: 20
  cloud: {mode: hybrid_inline, band: cs_cdf, threshold: 0.60, min_clear_fraction: 0.80}
run:
  output_dir: ${GEESAMPLER_DATA_ROOT:-./geesampler-output}/runs/point-timeseries
  workers: 8
  retries: 4
  monitoring: {enabled: true, required: false, poll_seconds: 30}
source:
  type: file
  path: examples/data/points.csv
  id_column: SampleID
  date_column: Date
  limit: 2
download:
  kind: point
  scenario: prepared-s2-timeseries
  collection_builder: geesampler.recipes.sentinel2:sentinel2_point_timeseries
  bands: [B2, B3, B4, B8, B11, B12]
  scale: 10
  selection:
    mode: all
    start_offset_days: 0
    end_offset_days: 365
    max_scenes: 100
